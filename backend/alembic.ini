# Alembic configuration file for the AI-Powered Compliance Tracker.
# This file is consumed by the `alembic` CLI tool.

[alembic]
# Path to migration scripts, relative to this file
script_location = alembic

# Template used to generate new migration file names.
# %(rev)s  → revision id
# %(slug)s → short description derived from --message
file_template = %%(rev)s_%%(slug)s

# Timezone to use when rendering the date within the migration file.
# Use UTC to keep revision timestamps unambiguous across developer machines.
timezone = UTC

# sys.path prepend — keep empty; the app package is on the path at runtime.
prepend_sys_path = .

# SQLAlchemy connection URL is read from the environment / .env file inside
# env.py so it does not need to be hard-coded here.
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks configured.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
